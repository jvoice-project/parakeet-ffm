name: CI
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: 21
  JAVA_DISTRO: temurin

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # Define your matrix as a JSON object
          MATRIX_JSON='{
            "include": [
              {"os": "ubuntu-24.04", "arch": "x86_64", "platform": "linux/amd64", "target": "linux-x86-64"},
              {"os": "ubuntu-24.04-arm", "arch": "aarch64", "platform": "linux/arm64", "target": "linux-aarch64"},
              {"os": "macos-15", "arch": "x86_64", "target": "macos-x86-64"},
              {"os": "macos-15", "arch": "aarch64", "target": "macos-aarch64"},
              {"os": "windows-latest", "arch": "x86_64", "target": "windows-x86-64"}
            ]
          }'
          echo "matrix=$(echo $MATRIX_JSON | jq -c .)" >> $GITHUB_OUTPUT

  build-lib:
    name: Build Library (${{ matrix.target }})
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      # --- Checkout and Setup ---
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
      # --- Linux Build Logic ---
      - name: Docker Setup Buildx
        if: runner.os == 'Linux'
        uses: docker/setup-buildx-action@v4
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target export \
            --output type=local,dest=dist/lib/ \
            .
      # --- macOS Build Logic ---
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/lib
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 ./build_macos.sh x86_64
          else
            ./build_macos.sh ${{ matrix.arch }}
          fi
          mv src/main/resources/${{ matrix.target }}/*.dylib dist/lib/
      # --- Windows Build Logic ---
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop' # Forces exit on error
          .\build_win.cmd
          if (!(Test-Path dist)) { mkdir dist }
          if (!(Test-Path dist\lib)) { mkdir dist\lib }
          move-item src\main\resources\${{ matrix.target }}\*.dll .\dist\lib\
      # --- Upload Artifacts ---
      - name: Upload Library
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/lib/

  build-maven:
    name: Maven Build
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          path: downloaded-artifacts
      - name: Setup resources
        run: |
          mkdir -p \
            src/main/resources/linux-x86-64 \
            src/main/resources/linux-aarch64 \
            src/main/resources/macos-x86-64 \
            src/main/resources/macos-aarch64 \
            src/main/resources/windows-x86-64

          cp downloaded-artifacts/linux-x86-64/* src/main/resources/linux-x86-64/
          cp downloaded-artifacts/linux-aarch64/* src/main/resources/linux-aarch64/
          cp downloaded-artifacts/macos-x86-64/* src/main/resources/macos-x86-64/
          cp downloaded-artifacts/macos-aarch64/* src/main/resources/macos-aarch64/
          cp downloaded-artifacts/windows-x86-64/* src/main/resources/windows-x86-64/
      - name: Bundle resources as tarball
        run: |
          mkdir -p dist
          tar -cvf dist/resources.tar -C ./src/main/resources/ .
      - name: Upload resources tarball
        uses: actions/upload-artifact@v7
        with:
          name: parakeet-ffm-resources
          path: dist/resources.tar
      - name: Build with Maven
        run: ./mvnw -B package -DskipTests -Dsource.skip=true
      - name: Bundle JAR as tarball
        run: |
          mkdir -p dist/target
          cp target/parakeet-ffm-*.jar dist/target/
          rm -f dist/target/parakeet-ffm-*-sources.jar
          tar -cvf dist/jar.tar -C dist/target/ .
      - name: Upload JAR tarball
        uses: actions/upload-artifact@v7
        with:
          name: parakeet-ffm
          path: dist/jar.tar
      - name: Run tests
        run: ./mvnw -B test -DexcludedGroups=integration -DskipDownloadTestData=true

  test-maven:
    name: Maven Test (${{ matrix.target }})
    needs: [setup-matrix, build-maven]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: parakeet-ffm-resources
          path: dist/
      - name: Extract resources tarball
        shell: bash
        run: |
          mkdir -p src/main/resources
          tar -xvf dist/resources.tar -C ./src/main/resources/
      - name: Run Maven Tests
        shell: bash
        run: |
          # Use -DforkCount=0 to run tests in the same process as Maven.
          # This avoids the "Abort trap 6" caused by the fork losing library context.
          # Also explicitly set the native library path just in case.
          COMMON_OPTS="-B -DforkCount=0 -Ddebug.piper.jni=true"

          # Specific check for macOS Intel on ARM runner
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.arch }}" == "x86_64" ]]; then
            echo "Running tests via Rosetta for x86_64"
            arch -x86_64 ./mvnw $COMMON_OPTS test
          else
            ./mvnw $COMMON_OPTS test
          fi

  deploy:
    name: Deploy to Maven Central
    if: github.repository == 'jvoice-project/parakeet-ffm' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-maven, test-maven]
    environment: central-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      # Download & Extract resources artifact
      - uses: actions/download-artifact@v8
        with:
          name: parakeet-ffm-resources
          path: dist/
      - name: Extract resources tarball
        shell: bash
        run: |
          mkdir -p src/main/resources
          tar -xvf dist/resources.tar -C ./src/main/resources/
      # Deploy
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy with Maven
        id: deploy
        run: |
          ./mvnw -B clean deploy -DskipTests -Pci-cd
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          PIPER_VERSION=$(echo "${VERSION%%"-"*}")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "PIPER_VERSION=$PIPER_VERSION" >> $GITHUB_OUTPUT
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Release
        uses: softprops/action-gh-release@v3
        id: create_release
        with:
          name: Piper JNI v${{ steps.deploy.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: A JNI wrapper for Piper v${{ steps.deploy.outputs.PIPER_VERSION }}
          files: |
            target/parakeet-ffm-${{ steps.deploy.outputs.VERSION }}.jar
        env:
          GITHUB_TOKEN: ${{ github.token }}
